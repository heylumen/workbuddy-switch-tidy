name: test

# 测试必须独立于发布流程：发布流程仅由 tag push / workflow_dispatch 触发，
# 测试若挂在它下面，就只在发版时执行——2026-09 的 Windows「os error 5」回归
# 正是这样漏到 0.1.43 的。本 workflow 在 push 与 PR 上即触发。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 三平台结果一次跑齐：任一平台失败不阻塞其余平台出结果。
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 build.yml 分开的 key 前缀（那边是 release profile 产物），
      # restore-keys 回落到它的缓存，以复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      # 只跑 core：零 tauri 依赖，不需要 webkit / npm / 前端 dist。
      # 不传 --target，用 runner 原生 target——build.yml 的 mac-x64 是 arm runner 上
      # 交叉编译 x86_64，跑测试需要 Rosetta，不适用于本 job。
      - name: Run tests
        run: cargo test -p wb-switch-core

      # linux 专属 cfg 分支只在 ubuntu 上展开（macOS 侧由 lint job 覆盖）。
      # rust-embed 要求 #[folder] 目录存在，先建 dist 占位（前端产物由 build.yml 产出）。
      - name: Clippy (linux cfg)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cargo clippy -p wb-switch-core -p wb-switch-server --all-targets --no-deps -- -D warnings

  # 前端类型、格式与 lint 门禁。跑在 macOS 上：clippy 按宿主平台展开 cfg 分支，
  # 与开发者本机一致，本地全绿即 CI 全绿。linux 专属分支由 rust-tests 的 ubuntu
  # job 覆盖，windows 分支暂未纳入。
  # clippy 必须带 --no-deps：仅检查本仓库代码，依赖告警不归本仓库。
  lint:
    name: lint (tsc + fmt + clippy + server tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 rust-tests 相同的 key 前缀，直接复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # tsc 顺带产出 dist：clippy 检查 src-tauri 时 tauri-build 要求 frontendDist 存在。
      - name: Type-check and build frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --check -p wb-switch-core -p wb-switch-server -p wb-switch-rust

      - name: Clippy
        run: cargo clippy -p wb-switch-core -p wb-switch-server -p wb-switch-rust --all-targets --no-deps -- -D warnings

      # server 的测试此前从不运行（rust-tests 只覆盖 core）。
      - name: Server tests
        run: cargo test -p wb-switch-server

      # src-tauri 的测试此前从不运行（rust-tests 只覆盖 core）。
      # 前置 dist 已由上方前端构建就位；本 fork 已移除 companion externalBin。
      - name: Desktop app tests
        run: cargo test -p wb-switch-rust

  # 轻量门禁：不依赖 Tauri/WebKit，适合所有 PR 快速阻断版本漂移、依赖漏洞和发布文案泄密。
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 台账校验需要祖先提交；浅克隆会让 merge-base 误报。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version consistency
        run: python scripts/check-version-consistency.py

      - name: Portability gate
        run: python scripts/check-portability.py

      - name: Demo command coverage
        run: python scripts/check-demo-commands.py

      - name: Repair ledger consistency
        run: python scripts/check-repair-ledger.py

      # 前端调用的 Tauri 命令 / HTTP 接口必须真实存在：tsc 与 cargo 都查不出这类字符串契约。
      # 指标只能下降：静默丢弃/pod 无 unwrap/最大文件行数/TODO 数量。
      # workflow 文件写错时 GitHub 不会报错、只会静默不运行，这里提前拦住语法问题。
      - name: Workflow YAML syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          failed = False
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(path, encoding='utf-8'))
                  print(f'ok   {path}')
              except Exception as error:
                  print(f'FAIL {path}: {error}', file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Debt ratchet
        run: python scripts/check-debt-ratchet.py

      - name: Command / route contract
        run: python scripts/check-command-routes.py

      - name: Legacy color fallbacks
        run: python scripts/check-legacy-colors.py

      - name: PII scan (README / release body)
        run: python scripts/check-pii.py README.md

      # 构建产物必须真的能跑：vite build 成功 ≠ 能运行（2026-11-22 白屏事故）。
      # 断言 window.__WB_MOUNTED__ === true，失败会打印资源 404 / 脚本异常详情。
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Frontend runtime smoke
        run: python scripts/smoke-webui.py --require-browser

      - name: Install frontend deps for audit
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 前端行为测试：纯逻辑单测（node 环境），不依赖 Rust 工具链。
  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

